<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1020" width="940" height="1020" role="img" aria-label="Travel Planner use case diagram">
  <title>Travel Planner — Use case diagram</title>

  <defs>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="uc-gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .t     { font-family: "Segoe UI", system-ui, sans-serif; }
    .sys   { font-size: 13px; font-weight: 600; fill: #475569; }
    .band  { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .3px; }
    .uc    { font-size: 12.5px; fill: #1e293b; }
    .ucs   { font-size: 10.5px; fill: #64748b; }
    .actor { font-size: 12.5px; font-weight: 600; fill: #334155; }
    .note  { font-size: 11px; fill: #94a3b8; }
  </style>

  <rect x="0" y="0" width="940" height="1020" fill="#f8fafc"/>

  <!-- ── System boundary ──────────────────────────────────── -->
  <text class="t sys" x="555" y="30" text-anchor="middle">«system»  Travel Planner</text>
  <rect x="210" y="40" width="690" height="910" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>

  <!-- ── Band A: authentication ───────────────────────────── -->
  <rect x="225" y="58" width="660" height="136" rx="10" fill="#eef2ff"/>
  <text class="t band" x="238" y="78">AUTHENTICATION &amp; PROFILE</text>

  <ellipse cx="390" cy="120" rx="145" ry="23" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text class="t uc" x="390" y="125" text-anchor="middle">Register account</text>
  <ellipse cx="720" cy="120" rx="145" ry="23" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text class="t uc" x="720" y="125" text-anchor="middle">Log in / log out</text>
  <ellipse cx="390" cy="168" rx="145" ry="23" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text class="t uc" x="390" y="173" text-anchor="middle">Edit profile details</text>
  <ellipse cx="720" cy="168" rx="145" ry="23" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text class="t uc" x="720" y="173" text-anchor="middle">Change password</text>

  <!-- ── Band B: travel plans ─────────────────────────────── -->
  <rect x="225" y="206" width="660" height="186" rx="10" fill="#ecfdf5"/>
  <text class="t band" x="238" y="226">TRAVEL PLANS</text>

  <ellipse cx="390" cy="264" rx="145" ry="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text class="t uc" x="390" y="269" text-anchor="middle">Create travel plan</text>
  <ellipse cx="720" cy="264" rx="145" ry="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text class="t uc" x="720" y="269" text-anchor="middle">View own travel plans</text>
  <ellipse cx="390" cy="312" rx="145" ry="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text class="t uc" x="390" y="317" text-anchor="middle">Edit travel plan</text>
  <ellipse cx="720" cy="312" rx="145" ry="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text class="t uc" x="720" y="317" text-anchor="middle">Delete travel plan</text>
  <ellipse cx="390" cy="360" rx="145" ry="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text class="t uc" x="390" y="365" text-anchor="middle">Export plan as PDF</text>

  <!-- ── Band C: trip content ─────────────────────────────── -->
  <rect x="225" y="404" width="660" height="186" rx="10" fill="#f0f9ff"/>
  <text class="t band" x="238" y="424">TRIP CONTENT</text>

  <ellipse cx="390" cy="462" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="390" y="467" text-anchor="middle">Manage destinations</text>
  <ellipse cx="720" cy="462" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="720" y="467" text-anchor="middle">Manage activities</text>
  <ellipse cx="390" cy="510" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="390" y="515" text-anchor="middle">View activity calendar</text>
  <ellipse cx="720" cy="510" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="720" y="515" text-anchor="middle">Record expenses</text>
  <ellipse cx="390" cy="558" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="390" y="563" text-anchor="middle">View budget summary</text>
  <ellipse cx="720" cy="558" rx="145" ry="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text class="t uc" x="720" y="563" text-anchor="middle">Manage checklist</text>

  <!-- ── Band D: sharing ──────────────────────────────────── -->
  <rect x="225" y="602" width="660" height="136" rx="10" fill="#fff7ed"/>
  <text class="t band" x="238" y="622">SHARING</text>

  <ellipse cx="390" cy="664" rx="145" ry="23" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text class="t uc" x="390" y="669" text-anchor="middle">Create share link + QR</text>
  <ellipse cx="720" cy="664" rx="145" ry="23" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text class="t uc" x="720" y="669" text-anchor="middle">Revoke share link</text>
  <ellipse cx="390" cy="712" rx="145" ry="26" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text class="t uc" x="390" y="710" text-anchor="middle">Open shared plan</text>
  <text class="t ucs" x="390" y="724" text-anchor="middle">VIEW or EDIT link</text>
  <ellipse cx="720" cy="712" rx="145" ry="26" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text class="t uc" x="720" y="710" text-anchor="middle">Edit shared plan content</text>
  <text class="t ucs" x="720" y="724" text-anchor="middle">EDIT link only</text>

  <!-- ── Band E: administration ───────────────────────────── -->
  <rect x="225" y="750" width="660" height="186" rx="10" fill="#fef2f2"/>
  <text class="t band" x="238" y="770">ADMINISTRATION</text>

  <ellipse cx="390" cy="808" rx="145" ry="23" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text class="t uc" x="390" y="813" text-anchor="middle">View all user accounts</text>
  <ellipse cx="720" cy="808" rx="145" ry="23" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text class="t uc" x="720" y="813" text-anchor="middle">Change user role</text>
  <ellipse cx="390" cy="856" rx="145" ry="23" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text class="t uc" x="390" y="861" text-anchor="middle">Activate / deactivate user</text>
  <ellipse cx="720" cy="856" rx="145" ry="23" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text class="t uc" x="720" y="861" text-anchor="middle">View all travel plans</text>
  <ellipse cx="390" cy="904" rx="145" ry="23" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text class="t uc" x="390" y="909" text-anchor="middle">Delete any travel plan</text>

  <!-- ── Actor: Registered user ───────────────────────────── -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <circle cx="100" cy="286" r="13" fill="#ffffff"/>
    <line x1="100" y1="299" x2="100" y2="331"/>
    <line x1="82"  y1="310" x2="118" y2="310"/>
    <line x1="100" y1="331" x2="86"  y2="353"/>
    <line x1="100" y1="331" x2="114" y2="353"/>
  </g>
  <text class="t actor" x="100" y="372" text-anchor="middle">Registered</text>
  <text class="t actor" x="100" y="388" text-anchor="middle">user</text>

  <line x1="118" y1="300" x2="225" y2="126" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120" y1="308" x2="225" y2="300" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120" y1="320" x2="225" y2="496" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="115" y1="330" x2="225" y2="668" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- ── Actor: Guest with link ───────────────────────────── -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <circle cx="100" cy="640" r="13" fill="#ffffff"/>
    <line x1="100" y1="653" x2="100" y2="685"/>
    <line x1="82"  y1="664" x2="118" y2="664"/>
    <line x1="100" y1="685" x2="86"  y2="707"/>
    <line x1="100" y1="685" x2="114" y2="707"/>
  </g>
  <text class="t actor" x="100" y="726" text-anchor="middle">Guest</text>
  <text class="t actor" x="100" y="742" text-anchor="middle">with link</text>
  <text class="t note"  x="100" y="758" text-anchor="middle">no account</text>

  <line x1="120" y1="670" x2="245" y2="712" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120" y1="676" x2="575" y2="726" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ── Actor: Administrator ─────────────────────────────── -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <circle cx="100" cy="848" r="13" fill="#ffffff"/>
    <line x1="100" y1="861" x2="100" y2="893"/>
    <line x1="82"  y1="872" x2="118" y2="872"/>
    <line x1="100" y1="893" x2="86"  y2="915"/>
    <line x1="100" y1="893" x2="114" y2="915"/>
  </g>
  <text class="t actor" x="100" y="934" text-anchor="middle">Administrator</text>

  <line x1="120" y1="860" x2="225" y2="838" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- generalisation: admin is also a registered user -->
  <line x1="100" y1="835" x2="100" y2="405" stroke="#64748b" stroke-width="1.3" marker-end="url(#uc-gen)"/>
  <text class="t note" x="112" y="620" transform="rotate(-90 112 620)" text-anchor="middle">is a</text>

  <!-- ── Notes ────────────────────────────────────────────── -->
  <text class="t note" x="210" y="978">A line to a group means the actor may perform every use case in that group.</text>
  <text class="t note" x="210" y="996">The hollow triangle reads “Administrator is a Registered user” — admins keep all user capabilities.</text>
  <text class="t note" x="210" y="1014">Dashed line: available only when the share link grants EDIT.</text>
</svg>
